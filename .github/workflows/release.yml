# Release: on a pushed tag v* (on main), run the tests, then build the zip with the BigWigs
# packager and upload it to CurseForge (project id from the TOC's X-Curse-Project-ID) and to a
# GitHub release. See README.md, "Continuous integration".
# Needs the repository secret CF_API_KEY (a CurseForge API token); GITHUB_TOKEN is automatic.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/test.yml

  release:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write # create the GitHub release and upload the zip to it
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the packager reads the tag and the history
          persist-credentials: false

      - name: Check that the tag is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not on main; tag a commit of main"
            exit 1
          fi

      # The game version comes from the TOC: the packager reads "## Interface: 16001" as game
      # type "forever" (any 16???) and game version 1.60.1, and tags the CurseForge file with
      # the WoW Forever version "1.60.1". No -g, so a TOC bump moves the upload with it.
      # -n: zip LevelScout-<tag>.zip and upload label <tag> (without the default "-forever").
      # -a 0 -w 0: no Wago and no WoWInterface upload (no projects there yet).
      - name: Package and upload
        uses: BigWigsMods/packager@01e8631a69c69d7654c788d152630d5fed9e3812 # v2.7.0
        with:
          args: -a 0 -w 0 -n "{package-name}-{project-version}:{project-version}"
          pandoc: "false"
        # The packager's current names; CF_API_KEY and GITHUB_OAUTH are its deprecated aliases.
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_KEY }}
          GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
