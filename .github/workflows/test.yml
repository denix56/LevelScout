# The test suite (./run_tests.sh) under Lua 5.1, with the real QuestieDB for the real-data tests.
# Runs for pull requests (any branch) and pushes to main only, not for pushes to other branches.
# Also callable: by release.yml before packaging (workflow_call), and by hand or by
# update-data.yml for its data pull request (workflow_dispatch: pull requests opened with
# GITHUB_TOKEN do not start pull_request runs). Branch protection can require the "test" check.
name: test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  # One run per pull request (a newer push cancels the older run); one per ref otherwise.
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Run the tests
        run: ./run_tests.sh -j "$(nproc)"
